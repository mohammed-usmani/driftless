# The whole demo: a source Postgres, Debezium on Kafka, two Driftless instances, the pgvector index,
# Prometheus and Grafana. Embeddings come from Ollama on the host.
#   cp .env.example .env && docker compose up -d --build && ./scripts/seed.sh && ./scripts/demo.sh
x-driftless: &driftless
  build:
    context: .
    dockerfile: driftless-server/Dockerfile
  environment:
    SPRING_PROFILES_ACTIVE: demo
    DRIFTLESS_DB_URL: jdbc:postgresql://index-db:5432/driftless
    DRIFTLESS_DB_USER: driftless
    DRIFTLESS_DB_PASSWORD: ${INDEX_DB_PASSWORD:?copy .env.example to .env}
    DRIFTLESS_KAFKA: kafka:9092
    DRIFTLESS_CONNECT_URL: http://connect:8083
    DRIFTLESS_SOURCE_URL: jdbc:postgresql://source-db:5432/source
    DRIFTLESS_SOURCE_USER: driftless
    DRIFTLESS_SOURCE_PASSWORD: ${SOURCE_DRIFTLESS_PASSWORD:?copy .env.example to .env}
    DRIFTLESS_ADMIN_TOKEN: ${DRIFTLESS_ADMIN_TOKEN:?copy .env.example to .env}
    DRIFTLESS_OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
    ARTICLES_EMBED_PROVIDER: ${ARTICLES_EMBED_PROVIDER:-ollama}
    ARTICLES_EMBED_MODEL: ${ARTICLES_EMBED_MODEL:-nomic-embed-text}
    ARTICLES_EMBED_DIMS: ${ARTICLES_EMBED_DIMS:-768}
    ARTICLES_MAX_CHARS: ${ARTICLES_MAX_CHARS:-2000}
  extra_hosts: ["host.docker.internal:host-gateway"]
  depends_on:
    source-db: { condition: service_healthy }
    index-db: { condition: service_healthy }
    connect: { condition: service_healthy }
  networks: [driftless]
  restart: unless-stopped
  stop_grace_period: 30s

services:
  source-db:
    image: postgres:17
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=10", "-c", "max_wal_senders=10"]
    environment:
      POSTGRES_DB: source
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${SOURCE_APP_PASSWORD:?copy .env.example to .env}
      SOURCE_DRIFTLESS_PASSWORD: ${SOURCE_DRIFTLESS_PASSWORD:?copy .env.example to .env}
    volumes:
      - source-data:/var/lib/postgresql/data
      - ./ops/postgres/source-init.sh:/docker-entrypoint-initdb.d/source-init.sh:ro
    ports: ["127.0.0.1:${SOURCE_DB_PORT:-5443}:5432"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "app", "-d", "source"]
      interval: 3s
      retries: 30
    networks: [driftless]

  index-db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: driftless
      POSTGRES_USER: driftless
      POSTGRES_PASSWORD: ${INDEX_DB_PASSWORD:?copy .env.example to .env}
    volumes: [index-data:/var/lib/postgresql/data]
    ports: ["127.0.0.1:${INDEX_DB_PORT:-5444}:5432"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "driftless", "-d", "driftless"]
      interval: 3s
      retries: 30
    networks: [driftless]

  kafka:
    image: apache/kafka:4.1.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes: [kafka-data:/var/lib/kafka/data]
    ports: ["127.0.0.1:9094:9094"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list > /dev/null"]
      interval: 5s
      retries: 30
    networks: [driftless]

  connect:
    image: quay.io/debezium/connect:3.7.1.Final
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: connect
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
    depends_on:
      kafka: { condition: service_healthy }
    ports: ["127.0.0.1:8083:8083"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/connectors > /dev/null"]
      interval: 5s
      retries: 40
    networks: [driftless]

  driftless-1:
    <<: *driftless
    ports: ["127.0.0.1:8180:8180"]

  driftless-2:
    <<: *driftless
    ports: ["127.0.0.1:8181:8180"]

  prometheus:
    image: prom/prometheus:v3.4.0
    volumes: [./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro]
    ports: ["127.0.0.1:9091:9090"]
    networks: [driftless]

  grafana:
    image: grafana/grafana:12.0.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/driftless.json
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["127.0.0.1:3002:3000"]
    networks: [driftless]

networks:
  driftless:

volumes:
  source-data:
  index-data:
  kafka-data:
