server:
  port: ${DRIFTLESS_PORT:8180}
  shutdown: graceful

spring:
  application:
    name: driftless
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: ${DRIFTLESS_DB_URL:jdbc:postgresql://localhost:5434/driftless}
    username: ${DRIFTLESS_DB_USER:driftless}
    password: ${DRIFTLESS_DB_PASSWORD:driftless}
  kafka:
    bootstrap-servers: ${DRIFTLESS_KAFKA:localhost:9094}
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      # a batch is processed before the next poll; 100 records keeps that well inside max.poll.interval.ms even when
      # every record needs a slow local model shared by all consumers (500 livelocked a migration to mxbai-embed-large)
      max-poll-records: 100
      key-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
      properties:
        # topics are matched by pattern; a new pipeline's topic is noticed on the next metadata refresh
        metadata.max.age.ms: 5000
        # only bounds processing time between polls; a dead consumer is still caught by heartbeats within seconds
        max.poll.interval.ms: 1800000
    producer:
      key-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
    listener:
      type: batch
      ack-mode: manual

driftless:
  kafka-connect-url: ${DRIFTLESS_CONNECT_URL:http://localhost:8083}
  admin-token: ${DRIFTLESS_ADMIN_TOKEN:}
  source:
    url: ${DRIFTLESS_SOURCE_URL:jdbc:postgresql://localhost:5433/source}
    user: ${DRIFTLESS_SOURCE_USER:driftless}
    password: ${DRIFTLESS_SOURCE_PASSWORD:driftless}

logging:
  structured:
    format:
      console: ${DRIFTLESS_LOG_FORMAT:ecs}

management:
  server:
    # actuator lives on its own port: scrape and probe it from inside the network, never expose it
    port: ${DRIFTLESS_MANAGEMENT_PORT:8189}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-components: always
      group:
        liveness:
          include: livenessState,ping
        readiness:
          include: readinessState,db
  metrics:
    tags:
      application: ${spring.application.name}
